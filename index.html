  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    @font-face {
      font-family: "Wonder Boys";
      src: url("TemplateData/Wonder Boys - Personal Use.ttf") format("truetype");
      font-weight: normal;
      font-style: normal;
    }

    html,
    body {
      height: 100%;
      background-color: #0c0222;
      background-size: cover;
      background-position: center;
      transition: background-image 0.3s ease;
      color: white;
      font-family: "Wonder Boys", sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-color: #0d0b1d96;
      z-index: 0;
      pointer-events: none;
    }

    .container {
      height: 100%;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding: 1.5rem;
      text-transform: uppercase;
      position: relative;
      z-index: 1;
    }

    .content {
      width: 100%;
      max-width: 420px;
      height: 50svh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .logo {
      text-align: center;
      font-size: 2rem;
      letter-spacing: 2px;
      font-weight: bold;
    }

    .logo .games {
      background: linear-gradient(to right,
          #b347f2,
          #ff6363,
          #fbb034,
          #3bd1ff);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .bottom-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .loading-text {
      font-weight: bold;
    }

    .progress-bar-container {
      width: 100%;
      height: 16px;
      background: #eee;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar-fill {
      height: 100%;
      background: #6c53e8;
      border-radius: 0px;
      position: relative;
      width: 0%;
      transition: width 0.3s ease;
    }

    .progress-bar-border {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 4px;
      background-color: #4e3cc2;
      width: 0%;
      transition: width 0.3s ease;
      z-index: 1;
    }

    .tip-box {
      background: #ffffff14;
      padding: 1rem;
      border-radius: 16px;
      font-size: 0.875rem;
      font-weight: 600;
      text-align: center;
      line-height: 1.4;
      width: 100%;
      position: relative;
    }

    .pointer {
      position: absolute;
      bottom: -8px;
      left: -8px;
    }

    .hide {
      visibility: hidden;
    }

    .glint {
      opacity: 0;
      transition: opacity 1s ease;
      display: inline-block;
      position: absolute;
      width: 6px;
      height: 12px;
      background-color: #8a76ed;
      border-radius: 100%;
      transform: rotate(58deg);
      left: 6px;
      top: 0px;
      z-index: 2;
    }

    .glint.visible {
      opacity: 1;
    }

    canvas {
      opacity: 0;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      transition: opacity 0.25s ease;
      pointer-events: none;
    }

    .container {
      transition: opacity 0.25s ease;
    }

    .unity-loaded canvas {
      opacity: 1;
      pointer-events: auto;
    }

    .unity-loaded .container {
      opacity: 0;
      pointer-events: none;
    }

    /* connection lost connection-lost-modal */
    /* Backdrop overlay */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    /* connection-lost-Modal box */
    .connection-lost-modal {
      background-color: #4e3cc2;
      color: white;
      padding: 24px 24px 32px 24px;
      border-radius: 25px;
      width: 343px;
      max-width: 90%;
      text-align: center;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
    }

    .connection-lost-modal .icon {
      font-size: 2.625rem;
      margin-bottom: 16px;
    }

    .connection-lost-modal h1 {
      font-size: 32px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .connection-lost-modal p {
      font-size: 16px;
      color: #eee;
      margin-bottom: 30px;
      font-family: "Nunito", sans-serif;
    }

    .button-container {
      display: flex;
      gap: 12px;
    }

    .btn {
      position: relative;
      font-size: 1.25rem;
      font-weight: bold;
      padding: 13px 16px;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 10px 0 #4e39ad;
      transition: all 0.15s ease;
      flex: 1;
      font-family: "Wonder Boys", sans-serif;
    }

    .btn span {
      position: relative;
      z-index: 1;
      text-shadow: 1px 2px rgba(0, 0, 0, 0.1);
    }

    .btn:active {
      padding-top: 15px;
      padding-bottom: 11px;
      box-shadow: inset 0 3px 5px rgba(0, 0, 0, 0.3);
      transform: translateY(0);
      position: relative;
      top: 8px;
    }

    .retry-later {
      background-color: #fff;
      color: #5c3bee;
      box-shadow: inset 0 4px 6px rgba(0, 0, 0, 0.1), 0 10px 0 #bbb;
    }

    .retry {
      border: 2px solid #8a76ed;
      border-left-width: 0;
      border-right-width: 0;
      background-color: #7c5cf5;
      color: #fff;
      box-shadow: inset 0 4px 6px rgba(0, 0, 0, 0.1), 0 10px 0 #4e39ad;
      position: relative;
    }

    .retry::before {
      content: "";
      position: absolute;
      top: 4px;
      left: 8px;
      width: 8px;
      height: 16px;
      background: #ffffff33;
      border-radius: 50%;
      transform: rotate(-120deg);
      z-index: 0;
    }

    .retry-later::before {
      content: "";
      position: absolute;
      top: 4px;
      left: 8px;
      width: 8px;
      height: 16px;
      background: #f5f5f5;
      border-radius: 50%;
      transform: rotate(-120deg);
      z-index: 0;
    }

    /* Switch to mobile modal */
    .switch-to-mobile-modal {
      background-color: transparent;
      color: white;
      padding: 24px 24px 32px 24px;
      border-radius: 25px;
      max-width: 600px;
      max-width: 90%;
      text-align: center;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
    }

    .switch-to-mobile-modal h1 {
      font-size: 2.5rem;
      margin-bottom: 12px;
      text-transform: uppercase;
      margin-top: 21px;
    }

    .switch-to-mobile-modal p {
      font-size: 1.625rem;
      text-transform: uppercase;
      margin-bottom: 30px;
    }

    .switch-to-mobile-modal .exit-btn {
      max-width: fit-content;
      margin: 0 auto;
    }

    .switch-to-mobile-modal .auto-exit-container {
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(2.5px);
      display: flex;
      padding: 12px;
      justify-content: center;
      align-items: center;
      gap: 4px;
      margin-bottom: 12px;
      margin-right: auto;
      margin-left: auto;
      width: fit-content;
      min-width: 165px;
      font-size: 0.875rem;
    }

    #progressBarContainerEl {
      transition: border-bottom 0.3s ease;
      border-bottom: 4px solid transparent;
    }
  </style>

  <script>
    const config = window._HYPER_LOADER_CONFIG || {}; // {window._HYPER_LOADER_CONFIG} Referenced in a Replace function in Unity
    const hintInterval = 5000;
    const backgroundImageUrl = config.backgroundImage || null;
    const hasBackgroundImage = !!backgroundImageUrl;

    document.querySelector(".progress-bar-fill").style.width = "0%";

    // if backgroundimage exists
    if (hasBackgroundImage) {
      document.body.style.backgroundImage = `url('${backgroundImageUrl}')`;
      document.querySelector(".logo").classList.add("hide");
    }

    // loading text animation
    const loadingTextEl = document.querySelector(".loading-text");
    const baseText = "INITIALIZING GAME";
    let dotCount = 0;

    window._HYPER_DOT_INTERVAL_ID = setInterval(() => {
      dotCount = (dotCount + 1) % 4;
      loadingTextEl.innerText = baseText + ".".repeat(dotCount);
    }, 500);

    // Unity resolution helper for mobile screens
    // if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
    //   // Mobile device style: fill the whole browser client area with the game canvas:
    //   var meta = document.createElement('meta');
    //   meta.name = 'viewport';
    //   meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
    //   document.getElementsByTagName('head')[0].appendChild(meta);

    //   var unitycanvas = document.querySelector("#unity-canvas");
    //   unitycanvas.style.width = "100%";
    //   unitycanvas.style.height = "100%";
    //   unitycanvas.style.position = "fixed";

    //   document.body.style.textAlign = "left";
    // }

    // else {
    //   // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:
    //   canvas.style.width = "1080px";
    //   canvas.style.height = "1920px";
    // }

    function extractPathSegment(url, segmentIndex) {
      try {
        const pathname = new URL(url).pathname;
        const segments = pathname.split("/").filter(Boolean);
        return segments[segmentIndex] || null;
      } catch (e) {
        return null;
      }
    }

    function checkIsMobile() {
      const ua = navigator.userAgent || navigator.vendor || window.opera;

      return /android|iphone|ipad|ipod|blackberry|iemobile|opera mini|kindle|silk|infinix|tecno|itel/i.test(
        ua
      );
    }

    const currentUrl = window.location.href;
    const extractedSegment = extractPathSegment(currentUrl, 0);
    let hasGameInitBeenStopped = false;
    let hasGameLoaded = false;
    let hasGameStarted = false;
    let isGameWindowVisible = true;

    const unityCanvasEl = document.getElementById("unity-canvas");
    const bottomContentEl = document.querySelector(".bottom-content");
    const CUSTOM_EVENTS = {
      SDK_CONNECTION_FAILED: "sdk_ConnectionFailed",
      SDK_WRONG_PLATFORM: "sdk_WrongPlatform",
      SDK_WRONG_ORIENTATION: "sdk_WrongOrientation",
      SDK_SESSION_TIMEOUT: "sdk_SessionTimedOut",
    };
    const SCREEN_ORIENTATIONS = {
      PORTRAIT_PRIMARY: "portrait-primary",
      PORTRAIT_SECONDARY: "portrait-secondary",
      LANDSCAPE_PRIMARY: "landscape-primary",
      LANDSCAPE_SECONDARY: "landscape-secondary",
    };
    const ORIENTATIONS = {
      LANDSCAPE: "landscape",
      PORTRAIT: "portrait",
    };
    const PLATFORMS = {
      DESKTOP: "desktop",
      MOBILE: "mobile",
    };
    const isMobile = checkIsMobile();
    const isDesktop = !isMobile;
    const platformTimerEl = document.getElementById(
      "platform-auto-exit-timer"
    );
    const urlParams = new URLSearchParams(window.location.search);
    const isBattleGame = urlParams.get("pvp") === "true";
    const acceptedScreenOrientation = "portrait";
    const acceptedPlatform = "mobile";
    const currentPlatform = isDesktop ? PLATFORMS.DESKTOP : PLATFORMS.MOBILE;
    const isOnCorrectPlatform = !acceptedPlatform
      ? true
      : currentPlatform === acceptedPlatform;

    async function fetchTips() {
      if (!isOnCorrectPlatform) return;
      try {
        const hintsResponse = await fetch(
          `https://api.dev.hypergames.app/games/${extractedSegment}/hints`
        );
        const hintRecords = await hintsResponse.json();
        const hints = hintRecords?.records || [];

        setInterval(() => {
          const tipIndex = Math.floor(Math.random() * hints.length);
          if (hints[tipIndex]?.hint) {
            document.querySelector(".tip-content").textContent =
              hints[tipIndex].hint;
          }
        }, 4000);
      } catch (e) {
        console.error(e);
      }
    }

    fetchTips();

    // connection lost modal
    function onDispatchEvent({ eventName, eventObj } = {}) {
      console.log(eventObj);
      const event = new CustomEvent(eventName);
      document.dispatchEvent(event);
      const messageEvent = new MessageEvent("message", {
        data: eventObj,
      });
      window.dispatchEvent(messageEvent);
    }

    function retryLater() {
      const eventName = CUSTOM_EVENTS.SDK_CONNECTION_FAILED;
      const eventObj = { name: eventName };

      onDispatchEvent({ eventName, eventObj });
    }

    function retryNow() {
      //checkRealInternetAccess();
      location.reload();
    }

    function fetchWithTimeout(resource, options = {}, timeout = 3000) {
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), timeout);

      return fetch(resource, {
        ...options,
        signal: controller.signal,
      }).finally(() => clearTimeout(id));
    }

    const statusEl = document.getElementById("connection-lost-modal-overlay");
    statusEl.style.display = "none";

    async function checkRealInternetAccess() {
      if (!navigator.onLine) return false;
      if (hasGameLoaded || !isGameWindowVisible) return true;

      try {
        await fetchWithTimeout("https://clients3.google.com/generate_204", {
          method: "GET",
          cache: "no-store",
          mode: "no-cors",
        });

        return true;
      } catch (e) {
        return false;
      }
    }

    function getCurrentScreenOrientation() {
      const orientation = screen.orientation.type;
      if (
        orientation === SCREEN_ORIENTATIONS.LANDSCAPE_PRIMARY ||
        orientation === SCREEN_ORIENTATIONS.LANDSCAPE_SECONDARY
      ) {
        return ORIENTATIONS.LANDSCAPE;
      } else if (
        orientation === SCREEN_ORIENTATIONS.PORTRAIT_PRIMARY ||
        orientation === SCREEN_ORIENTATIONS.PORTRAIT_SECONDARY
      ) {
        return ORIENTATIONS.PORTRAIT;
      }
      return orientation;
    }

    function checkIsCorrectOrientation() {
      return (
        !acceptedScreenOrientation ||
        acceptedScreenOrientation === getCurrentScreenOrientation()
      );
    }

    async function updateInternetAccessStatus() {
      const isCorrectScreenOrientation = checkIsCorrectOrientation();

      if (
        !isOnCorrectPlatform ||
        !isCorrectScreenOrientation ||
        hasGameLoaded
      )
        return;

      const online = await checkRealInternetAccess();
      statusEl.style.display = online ? "none" : "flex";
      bottomContentEl.style.display = online ? "flex" : "none";
    }

    updateInternetAccessStatus();

    window.addEventListener("online", updateInternetAccessStatus);
    window.addEventListener("offline", updateInternetAccessStatus);

    const internetAccessIntervalId = setInterval(
      updateInternetAccessStatus,
      5000
    );

    if (hasGameLoaded) {
      clearInterval(internetAccessIntervalId);
    }

    const SESSION_DURATION = 240; // Testing for 4 mins, Default to 1800 
    let sessionTimeLeft = SESSION_DURATION; //30 mins
    let sessionTimerInterval;

    // wrong platform
    function onWrongPlatformGameExit() {
      const eventName = CUSTOM_EVENTS.SDK_WRONG_PLATFORM;
      const eventObj = {
        name: eventName,
        data: {
          currentPlatform,
          recommendedPlatform: acceptedPlatform,
        },
      };

      onDispatchEvent({
        eventName,
        eventObj,
      });
    }

    const wrongPlatformEl = document.getElementById(
      "switch-to-mobile-modal-overlay"
    );
    const platformAutoExitWrapperEl = document.getElementById(
      "platform-auto-exit-wrapper"
    );
    const wrongPlatormHeadingEl = document.getElementById(
      "wrong-plaform-heading"
    );
    const wrongPlatfromSubheadEl = document.getElementById(
      "wrong-plaform-subhead"
    );
    platformAutoExitWrapperEl.style.display = isBattleGame ? "flex" : "none";
    wrongPlatormHeadingEl.textContent =
      acceptedPlatform === PLATFORMS.DESKTOP
        ? "switch to Desktop to play"
        : "switch to Mobile to play";
    wrongPlatfromSubheadEl.textContent =
      acceptedPlatform === PLATFORMS.DESKTOP
        ? "This game only works on desktop"
        : "This game only works on mobile";

    if (!isOnCorrectPlatform) {
      bottomContentEl.style.display = "none";
      wrongPlatformEl.style.display = "flex";

      const platformTimerEl = document.getElementById(
        "platform-auto-exit-timer"
      );

      let timeLeft = sessionTimeLeft === SESSION_DURATION ? 120 : SESSION_DURATION;
      let timerInterval;

      const updateTimer = () => {
        const minutes = String(Math.floor(timeLeft / 60)).padStart(2, "0");
        const seconds = String(timeLeft % 60).padStart(2, "0");
        platformTimerEl.textContent = `00:${minutes}:${seconds}`;

        if (timeLeft === 0) {
          clearInterval(timerInterval);
          onWrongPlatformGameExit();
        }

        timeLeft--;
      };

      if (isBattleGame) {
        updateTimer();
        timerInterval = setInterval(updateTimer, 1000);
      }
    } else {
      bottomContentEl.style.display = "flex";
      wrongPlatformEl.style.display = "none";
    }

    //wrong screen orientation
    const acceptedOrientationEl = document.getElementById(
      "accepted-orientation"
    );
    const rotateScreenImgEl = document.getElementById("rotate-screen-img");
    const wrongOrientationTimerEl = document.getElementById(
      "wrong-orientation-exit-timer"
    );
    const wrongOrientationEl = document.getElementById(
      "switch-orientation-modal-overlay"
    );
    const wrongOrientationAutoExitWrapperEl = document.getElementById(
      "orientation-auto-exit-wrapper"
    );
    const timerTextEl = document.getElementById("timer-text");
    const orientationExitCtaWrapper = document.getElementById(
      "orientation-exit-cta-wrapper"
    );

    // let timeLeft = hasGameLoaded ? sessionTimeLeft : 120;
    let timeLeft = 120;
    let timerInterval;

    const wrongPlatformImgEl = document.getElementById("wrong-platform-img");
    if (acceptedPlatform === PLATFORMS.DESKTOP) {
      wrongPlatformImgEl.src = "TemplateData/switch-mobile-desktop.svg";
    } else {
      wrongPlatformImgEl.src = "TemplateData/switch-desktop-mobile.svg";
    }

    function handleOrientation() {
      clearInterval(timerInterval);
      const isCorrectScreenOrientation = checkIsCorrectOrientation();

      if (!isOnCorrectPlatform) {
        wrongOrientationEl.style.display = "none";
        return;
      }

      if (isCorrectScreenOrientation) {

        if (unityCanvasEl) unityCanvasEl.style.display = "block";

        bottomContentEl.style.display = "flex";
        wrongOrientationEl.style.display = "none";
        // window.dispatchEvent(new Event("focus"));
        clearInterval(timerInterval);
        if (
          hasGameInitBeenStopped &&
          !hasGameLoaded &&
          !window?.unityInstance
        ) {
          location.reload();
          // initializeUnityGame();
        }
        return;
      }

      wrongOrientationEl.style.display = "flex";
      pauseUnityGame();

      if (hasGameLoaded) {
        timerTextEl.textContent =
          sessionTimeLeft <= 0
            ? "Game session ended"
            : "Game session ends in";
        orientationExitCtaWrapper.style.display = "none";
      } else {
        timerTextEl.textContent = "Auto exits in";
        orientationExitCtaWrapper.style.display = "block";
      }

      const currentScreenOrientation = getCurrentScreenOrientation();

      if (acceptedScreenOrientation) {
        acceptedOrientationEl.textContent =
          acceptedScreenOrientation === ORIENTATIONS.LANDSCAPE
            ? ORIENTATIONS.LANDSCAPE
            : ORIENTATIONS.PORTRAIT;
        if (currentScreenOrientation !== acceptedScreenOrientation) {
          if (unityCanvasEl) {
            unityCanvasEl.style.display = "none";
            pauseUnityGame();
            window.dispatchEvent(new Event("blur"));
          }
          bottomContentEl.style.display = "none";
          rotateScreenImgEl.src =
            acceptedScreenOrientation === ORIENTATIONS.LANDSCAPE
              ? "TemplateData/landscape-only.gif"
              : "TemplateData/portrait-only.gif";

          const updateTimer = () => {
            const minutes = String(
              hasGameLoaded
                ? Math.floor(sessionTimeLeft / 60)
                : Math.floor(timeLeft / 60)
            ).padStart(2, "0");
            const seconds = String(
              hasGameLoaded ? sessionTimeLeft % 60 : timeLeft % 60
            ).padStart(2, "0");
            wrongOrientationTimerEl.textContent =
              sessionTimeLeft <= 0 ? "" : `00:${minutes}:${seconds}`;

            if (!hasGameLoaded && timeLeft === 0) {
              clearInterval(timerInterval);
              onWrongOrientationGameExit();
            }

            if (hasGameLoaded && sessionTimeLeft === 0) {
              clearInterval(timerInterval);
              timerInterval = null;
              onSessionTimeoutGameExit();
            }

            timeLeft--;
          };

          if (isBattleGame) {
            updateTimer();
            clearInterval(timerInterval);
            timerInterval = setInterval(updateTimer, 1000);
          } else {
            wrongOrientationAutoExitWrapperEl.style.display = "none";
            clearInterval(timerInterval);
          }
        } else {
          if (unityCanvasEl) unityCanvasEl.style.display = "block";
          bottomContentEl.style.display = "flex";
          wrongOrientationEl.style.display = "none";
          // window.dispatchEvent(new Event("focus"));
          clearInterval(timerInterval);
          if (
            hasGameInitBeenStopped &&
            !hasGameLoaded &&
            !window?.unityInstance
          ) {
            location.reload();
            // initializeUnityGame();
          }
        }
      }
    }

    screen.orientation.addEventListener("change", handleOrientation);
    handleOrientation();

    function onWrongOrientationGameExit() {
      const eventName = CUSTOM_EVENTS.SDK_WRONG_ORIENTATION;
      const eventObj = { name: eventName };

      onDispatchEvent({ eventName, eventObj });
    }

    function onSessionTimeoutGameExit() {
      const eventName = CUSTOM_EVENTS.SDK_SESSION_TIMEOUT;
      const eventObj = { name: eventName };

      onDispatchEvent({
        eventName: CUSTOM_EVENTS.SDK_SESSION_TIMEOUT,
        eventObj,
      });
    }

    function startSessionCountdown() {
      const updateTimer = () => {
        console.log(sessionTimeLeft);
        if (sessionTimeLeft === 0) {
          clearInterval(sessionTimerInterval);
          sessionTimerInterval = null;

          // if (hasGameStarted) {
          //   onSessionTimeoutGameExit();
          // } else {
          //   onWrongPlatformGameExit();
          // }
        }
        sessionTimeLeft--;
      };

      if (isBattleGame) {
        updateTimer();
        clearInterval(sessionTimerInterval);
        sessionTimerInterval = setInterval(updateTimer, 1000);
      }
    }

    function markGameLoaded() {
      hasGameLoaded = true;
      hasGameStarted = false;
      clearInterval(sessionTimerInterval);
      sessionTimeLeft = SESSION_DURATION;
      startSessionCountdown();
    }

    function markGameStarted() {
      hasGameStarted = true;
      clearInterval(sessionTimerInterval);
      sessionTimeLeft = SESSION_DURATION;
      startSessionCountdown();
    }

    window.startSessionCountdown = startSessionCountdown;
    window.markGameLoaded = markGameLoaded;
    window.markGameStarted = markGameStarted;

    const progressBar = document.querySelector(".progress-bar-fill");
    const canvas = document.querySelector("canvas");
    const container = document.querySelector(".container");

    canvas.style.display = "block";

    // ========================
    // Unity Initialization
    // ========================
    async function initializeUnityGame() {
      const isCorrectScreenOrientation = checkIsCorrectOrientation();
      const canvas = document.querySelector("#unity-canvas");
      const progressBar = document.querySelector(".progress-bar-fill");
      const glintEl = document.querySelector(".glint");
      const progressBarContainerEl = document.querySelector(
        ".progress-bar-container"
      );
      const progressBarBorderEl = document.querySelector(
        ".progress-bar-border"
      );

      try {
        const canvasParent = canvas.parentElement || document.documentElement;
        if (canvasParent.requestFullscreen) {
          await canvasParent.requestFullscreen();
        } else if (canvasParent.webkitRequestFullscreen) {
          await canvasParent.webkitRequestFullscreen();
        } else if (canvasParent.msRequestFullscreen) {
          await canvasParent.msRequestFullscreen();
        }

        // if (
        //   screen.orientation &&
        //   screen.orientation.lock &&
        //   acceptedScreenOrientation
        // ) {
        //   await screen.orientation.lock(acceptedScreenOrientation);
        // }
      } catch (e) {
        console.warn("Fullscreen or orientation lock failed:", e);
      }

      try {
        const unityInstance = await createUnityInstance(
          canvas,
          {
            dataUrl: "Build/webgl version.data.gz",
            frameworkUrl: "Build/webgl version.framework.js.gz",
            codeUrl: "Build/webgl version.wasm.gz",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "Hyper",
            productName: "DotDash",
            productVersion: "1.0",
          },
          (progress) => {
            requestAnimationFrame(() => {
              const widthPercent = Math.round(progress * 100) + "%";
              progressBar.style.width = widthPercent;
              progressBarBorderEl.style.width = "100%";
              if (progress * 100 >= 15) {
                glintEl.classList.add("visible");
              } else {
                glintEl.classList.remove("visible");
              }
            });
          }
        );

        window.unityInstance = unityInstance;
        await fetchPublicKey();

        requestAnimationFrame(() => {
          handleUnityLoaded();
        });
      } catch (err) {
        console.error("Unity initialization failed:", err);
        alert("Failed to load game: " + err.message);
      }
    }

    async function fetchPublicKey() {
      try {
        const response = await fetch(
          "https://api.dev.hypergames.app/encryption/public-key"
        );
        if (!response.ok)
          throw new Error(`HTTP error! status: ${response.status}`);

        window.publicKey = normalizeKey(await response.text());
        //console.log('Public Key stored:', window.publicKey);
      } catch (err) {
        console.error("Failed to fetch public key:", err);
      }
    }

    window.splitIntoChunks = function (data) {
      try {
        const dataString = typeof data === 'string' ? data : JSON.stringify(data);
        const chunks = [];
        const dataBuffer = forge.util.encodeUtf8(dataString);

        for (let i = 0; i < dataBuffer.length; i += 190) {
          chunks.push(dataBuffer.slice(i, i + 190));
        }

        console.log("Successful, chunks: ", chunks);

        return chunks;
      } catch (error) {
        console.error("splitIntoChunks error:", error);
        return [];
      }
    };

    function normalizeKey(key) {
      return key
        .trim()
        .replace(/^["']|["']$/g, "")
        .replace(/\\n/g, "\n");
    }

    function handleUnityLoaded() {
      document.body.classList.add("unity-loaded");

      setTimeout(() => {
        document
          .querySelectorAll(
            ".loading-text, .progress-bar-container, .hint-box, .logo"
          )
          .forEach((el) => el.remove());

        clearInterval(window._HYPER_HINT_INTERVAL_ID);
        clearInterval(window._HYPER_DOT_INTERVAL_ID);
      }, 500);
    }

    function pauseUnityGame() {
      if (window.unityInstance) {
        unityInstance.SendMessage("HyperSDKSingleton", "PauseGame");
      }
    }

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") {
        isGameWindowVisible = false;
        pauseUnityGame();
      } else {
        isGameWindowVisible = true;
      }
    });

    document.addEventListener("DOMContentLoaded", () => {
      const isCorrectScreenOrientation = checkIsCorrectOrientation();
      if (!isOnCorrectPlatform || !isCorrectScreenOrientation) {
        hasGameInitBeenStopped = true;
        return;
      }
      //? Start Unity
      initializeUnityGame();
    });

    // Intercept at the window level BEFORE Unity gets it
    window.addEventListener(
      "orientationchange",
      function (event) {
        console.log("[O FIX] Fired for incorrect orientation");
        if (!checkIsCorrectOrientation()) {
          console.log("[O FIX] Fired intercept");
          event.preventDefault(); // Try to block it
          event.stopPropagation(); // Stop it from bubbling
          event.stopImmediatePropagation(); // Nuclear option
          return false;
        }
      },
      true
    ); // TRUE = capture phase (before Unity)

    // Also intercept resize events that happen during orientation change
    window.addEventListener(
      "resize",
      function (event) {
        if (!checkIsCorrectOrientation()) {
          event.preventDefault();
          event.stopPropagation();
          return false;
        }
      },
      true
    );
  </script>
</body>

</html>
